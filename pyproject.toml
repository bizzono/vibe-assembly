[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-assembly"
version = "0.1.0"
description = "An agent harness for writing verified, benchmarked assembly."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
vibeasm = "vibeasm.cli:main"

[tool.setuptools]
packages = ["vibeasm"]

[tool.setuptools.package-data]
vibeasm = ["kit/*", "prompts/*"]
